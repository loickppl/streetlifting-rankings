<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streetlifting World Rankings</title>
<meta name="description" content="Streetlifting world rankings & records — muscle-up, pull-up, dip, squat, total, RIS. Aggregated from official competition data.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23101011'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%23d8c9a3' font-family='Arial Black'>SL</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#" id="brand">
      <span class="brand-mark">SL</span>
      <span class="brand-name">STREET<em>LIFTING</em><small>RANKINGS</small></span>
    </a>
    <nav class="nav" id="tabs">
      <button class="nav-link active" data-tab="rankings" data-i18n="tab_rankings">Classements</button>
      <button class="nav-link" data-tab="records" data-i18n="tab_records">Records</button>
      <button class="nav-link" data-tab="athletes" data-i18n="tab_athletes">Athlètes</button>
    </nav>
    <div class="topbar-right">
      <button id="lang-toggle" class="lang-btn" title="Language">EN</button>
    </div>
  </div>
  <div class="hazard"></div>
</header>

<section class="hero">
  <div class="hero-ghost" aria-hidden="true">STREETLIFTING</div>
  <div class="wrap hero-inner">
    <p class="hero-kicker" data-i18n="hero_kicker">Records mondiaux · compétitions officielles</p>
    <h1 class="hero-title"><span data-i18n="hero_1">WORLD</span> <span class="volt" data-i18n="hero_2">RANKINGS</span></h1>
    <div class="hero-stats" id="hero-stats"></div>
  </div>
</section>

<main class="wrap main">

  <!-- ══════════ RANKINGS ══════════ -->
  <section id="panel-rankings" class="panel active">

    <div class="controls">
      <div class="controls-row">
        <div class="seg" id="f-gender" role="group">
          <button class="seg-btn active" data-value="male" data-i18n="men">Hommes</button>
          <button class="seg-btn" data-value="female" data-i18n="women">Femmes</button>
        </div>
        <div class="pills" id="f-metric">
          <button class="pill active" data-value="total" data-i18n="m_total">Total</button>
          <button class="pill" data-value="ris">RIS</button>
          <button class="pill" data-value="muscle_up" data-i18n="m_mu">Muscle-up</button>
          <button class="pill" data-value="pull_up" data-i18n="m_pu">Traction</button>
          <button class="pill" data-value="dip" data-i18n="m_dip">Dips</button>
          <button class="pill" data-value="squat" data-i18n="m_sq">Squat</button>
        </div>
      </div>

      <div class="controls-row">
        <div class="chips-scroll"><div class="chips" id="f-class"></div></div>
      </div>

      <div class="controls-row secondary">
        <label class="ctl">
          <span class="ctl-label" data-i18n="f_style">Style</span>
          <select id="f-style"><option value="" data-i18n="all_f">Tous</option></select>
        </label>
        <label class="ctl">
          <span class="ctl-label" data-i18n="f_period">Période</span>
          <select id="f-period">
            <option value="" data-i18n="p_all">Depuis toujours</option>
            <option value="365">12 mois</option>
            <option value="730">24 mois</option>
            <option value="custom" data-i18n="p_custom">Dates…</option>
          </select>
        </label>
        <label class="ctl date-ctl hidden" id="date-from-wrap">
          <span class="ctl-label" data-i18n="f_from">Du</span>
          <input id="f-from" type="date">
        </label>
        <label class="ctl date-ctl hidden" id="date-to-wrap">
          <span class="ctl-label" data-i18n="f_to">Au</span>
          <input id="f-to" type="date">
        </label>
        <label class="ctl">
          <span class="ctl-label" data-i18n="f_top">Top</span>
          <select id="f-top">
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="0" data-i18n="all_m">Tous</option>
          </select>
        </label>
        <label class="ctl grow search-ctl">
          <span class="ctl-label" data-i18n="f_search">Recherche</span>
          <input id="f-search" type="search" placeholder="Athlète, pays, compétition…" data-i18n-ph="ph_search">
        </label>
        <label class="switch">
          <input type="checkbox" id="f-best" checked>
          <span class="track"></span>
          <span class="switch-label" data-i18n="f_best">Meilleure perf par athlète</span>
        </label>
      </div>
    </div>

    <div class="podium" id="podium"></div>

    <div class="section-head">
      <h2 class="section-title" id="rankings-title"></h2>
      <span class="section-count" id="rankings-count"></span>
    </div>
    <div class="table-card">
      <div class="table-scroll">
        <table class="table" id="rankings-table"></table>
      </div>
    </div>
  </section>

  <!-- ══════════ RECORDS ══════════ -->
  <section id="panel-records" class="panel">
    <div class="controls">
      <div class="controls-row">
        <div class="seg" id="r-gender" role="group">
          <button class="seg-btn active" data-value="male" data-i18n="men">Hommes</button>
          <button class="seg-btn" data-value="female" data-i18n="women">Femmes</button>
        </div>
        <div class="seg" id="r-source" role="group">
          <button class="seg-btn active" data-value="finalrep">Final Rep</button>
          <button class="seg-btn" data-value="computed" data-i18n="src_computed">Base OSL</button>
        </div>
      </div>
    </div>
    <div id="records-grid" class="records-grid"></div>
  </section>

  <!-- ══════════ ATHLETES ══════════ -->
  <section id="panel-athletes" class="panel">
    <div class="controls">
      <div class="controls-row secondary">
        <div class="seg" id="a-gender" role="group">
          <button class="seg-btn active" data-value="" data-i18n="all_m">Tous</button>
          <button class="seg-btn" data-value="male" data-i18n="men">Hommes</button>
          <button class="seg-btn" data-value="female" data-i18n="women">Femmes</button>
        </div>
        <label class="ctl grow search-ctl">
          <span class="ctl-label" data-i18n="f_search">Recherche</span>
          <input id="a-search" type="search" placeholder="Nom, pays…" data-i18n-ph="ph_search_a">
        </label>
      </div>
    </div>
    <div class="table-card">
      <div class="table-scroll">
        <table class="table" id="athletes-table"></table>
      </div>
    </div>
  </section>
</main>

<!-- Athlete detail -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer class="footer">
  <div class="hazard"></div>
  <div class="wrap footer-inner">
    <div class="footer-brand">STREET<em>LIFTING</em> RANKINGS</div>
    <p data-i18n="footer_src">Sources : <a href="https://rankings.officialstreetlifting.com/" target="_blank" rel="noopener">Official Streetlifting</a> · <a href="https://final-rep.com/records/" target="_blank" rel="noopener">Final Rep</a> · RIS : <a href="https://warisradji.com/ris/" target="_blank" rel="noopener">warisradji.com</a></p>
    <p class="dim" data-i18n="footer_disc">Projet communautaire non affilié. Données agrégées automatiquement depuis des sources publiques.</p>
    <p class="dim" id="footer-updated"></p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
